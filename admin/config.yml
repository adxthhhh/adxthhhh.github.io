# LOCAL TESTING: To test the admin panel locally without OAuth, uncomment the line below.
# Once enabled, visit http://localhost:5173/admin/ and create posts (saved to browser storage).
# IMPORTANT: Remove this line before committing to production!
# local_backend: true

backend:
  name: github
  repo: adxthhhh/adxthhhh.github.io
  branch: main
  auth_endpoint: https://adxthhhh-github-io.vercel.app/
  open_authoring: false

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: simple

site_url: "https://adxthhhh.github.io"

collections:
  - name: "blog"
    label: "Blog"
    folder: "public/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
